spring.application.name=ecommerce
server.port =  8181
spring.datasource.url=jdbc:postgresql://localhost:5433/ecommerce_db
spring.datasource.username=ecom
spring.datasource.password=password765

spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway managing the database structure
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

#Flyway configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migration=true
# Enable Flyway baseline mode for non-empty schemas
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.schemas=public
spring.flyway.create-schemas=true